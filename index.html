<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Bezier</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    // Browser port of randBezier: a cubic bezier whose 4 points move with
    // random acceleration, bounce off the edges, and leave fading trails.
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, width, height);
    }
    resize();
    window.addEventListener('resize', resize);

    const rand = (lo, hi) => lo + Math.random() * (hi - lo);
    const points = Array.from({ length: 4 }, () => ({
      x: rand(0, width), y: rand(0, height), vx: 0, vy: 0,
    }));

    function frame() {
      // Fade previous frames
      ctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
      ctx.fillRect(0, 0, width, height);

      for (const p of points) {
        if (p.x > width || p.x < 0) p.vx = -p.vx;
        if (p.y > height || p.y < 0) p.vy = -p.vy;
        p.vx += rand(-0.1, 0.1);
        p.vy += rand(-0.1, 0.1);
        p.x += p.vx;
        p.y += p.vy;
      }

      const [a, c1, c2, b] = points;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.bezierCurveTo(c1.x, c1.y, c2.x, c2.y, b.x, b.y);
      ctx.stroke();

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
